name: Weekly cleanup
# Every Monday, Claude looks for unused/unneeded code and files and opens a PR.
# It never pushes to master: you review and merge the PR yourself.
on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC (6am PT)
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: weekly-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Skip if last week's cleanup PR is still open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list --label cleanup --state open --json number --jq length)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          [ "$n" = 0 ] || echo "::notice::A cleanup PR is already open; skipping this week."
      - uses: ruby/setup-ruby@v1
        if: steps.open.outputs.count == '0'
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Baseline build
        if: steps.open.outputs.count == '0'
        run: bundle exec jekyll build --quiet
      - name: Find and remove unused code
        if: steps.open.outputs.count == '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git rm:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(grep:*),Bash(ls:*),Bash(find:*),Bash(bundle exec jekyll build:*)"
          prompt: |
            You are doing a weekly cleanup of this Jekyll personal website (GitHub Pages, master branch).
            Goal: remove code and files that are unused or unneeded, conservatively.

            Good candidates:
            - Leftovers from the academicpages template that no page uses (sample publications/talks/teaching
              entries, placeholder PDFs in files/, markdown_generator/, unused layouts/includes/sass partials,
              unused JS, dead _config.yml settings, unused images).
            - Anything not referenced from any page, layout, include, stylesheet, script or config.

            Rules:
            - Only delete or trim things you have confirmed are unreferenced (grep for every filename/slug/
              include name across the repo, including _config.yml and _data, before removing it).
            - Never touch _data/books.yml or images/books/ (generated by an external sync).
            - Never rewrite the site owner's own writing or change how live pages look or behave.
              Do not refactor, restyle or reformat working code.
            - Keep files GitHub Pages needs (CNAME if present, Gemfile, _config.yml, LICENSE, README.md).
            - Do not commit; leave changes in the working tree. Use `git rm` for deletions.
            - After your changes, run `bundle exec jekyll build --quiet` and make sure it succeeds and that
              every page in _site that existed before still exists (except pages you intentionally removed
              because they were template samples).
            - If nothing is worth removing, change nothing.

            Finally write a short summary to /tmp/cleanup-summary.md: a bullet per removal with the reason
            (what you grepped for and found no references), plus anything you suspect is unused but left alone.
      - name: Verify build
        if: steps.open.outputs.count == '0'
        run: bundle exec jekyll build --quiet
      - name: Open PR
        if: steps.open.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A
          for p in .jekyll-cache .sass-cache .bundle; do git reset -q -- "$p" 2>/dev/null || true; done
          if git diff --cached --quiet; then
            echo "Nothing to clean up this week."
            exit 0
          fi
          branch="cleanup/$(date -u +%F)"
          git config user.name "weekly-cleanup"
          git config user.email "weekly-cleanup@users.noreply.github.com"
          git checkout -q -b "$branch"
          git commit -q -m "Weekly cleanup: remove unused code and files"
          git push -q origin "$branch"
          gh label create cleanup --color BFD4F2 --description "Automated weekly cleanup" 2>/dev/null || true
          body=$( { echo "Automated weekly cleanup. The site builds with these changes. Review before merging."; echo; cat /tmp/cleanup-summary.md 2>/dev/null || echo "(no summary written)"; } )
          gh pr create --base master --head "$branch" --label cleanup \
            --title "Weekly cleanup $(date -u +%F)" --body "$body"
