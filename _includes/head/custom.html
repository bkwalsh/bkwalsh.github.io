{% include base_path %}

<!-- start custom head snippets -->

<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{ base_path }}/images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon.png">
<meta name="theme-color" content="#10141c">
{% assign a = site.author %}{% if a.arxiv or a.googlescholar or a.semantic or a.impactstory or a.orcid or a.pubmed or a.researchgate %}
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>
{% endif %}


<!-- MathJax: only on pages that set `mathjax: true` in front matter -->
{% if page.mathjax %}
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

<!-- end custom head snippets -->
